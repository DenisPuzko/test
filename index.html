<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг світла</title>
    <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23ffc107%22>⚡</text></svg>">

    <style>
        :root {
            --bg-body: #f8f9fa;
            --card-bg: #ffffff;
            --off-gray: #333333;
            --on-border: #e9ecef;
            --accent-yellow: #d71111;
            --primary-yellow: #ff6c00;

        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            margin: 0;
        }

        /* Стилі для екрану налаштувань */
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        select, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
        .save-btn { background: var(--primary-yellow); color: white; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }

        /* Стилі твоєї сітки */
        .schedule-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .slot {
            height: 54px;
            border: 1px solid var(--on-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            position: relative;
            background: white;
            overflow: hidden;
        }

        .slot span { position: relative; z-index: 2; color: #ffffff; mix-blend-mode: difference; }

        .slot.off { background-color: var(--off-gray); border-color: var(--off-gray); }
        .slot.split-start { background: linear-gradient(90deg, #fff 50%, var(--off-gray) 50%); }
        .slot.split-end { background: linear-gradient(90deg, var(--off-gray) 50%, #fff 50%); }

        .days-nav { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .day { font-weight: bold; color: #555; padding: 5px 10px; }
        .day.active { color: var(--primary-yellow); border-bottom: 3px solid var(--primary-yellow); }

        .status-bar { margin-top: 15px; font-size: 12px; color: #888; text-align: center; }
        .reset-link { color: #888; text-decoration: underline; cursor: pointer; font-size: 12px; display: block; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div id="setup-screen" class="card">
    <h2 style="margin-top:0">Налаштування</h2>
    <p style="font-size:14px; color: #666;">Оберіть адресу, щоб дізнатися чергу</p>
    <select id="department"><option value="">Завантаження філій...</option></select>
    <select id="city" class="hidden"></select>
    <select id="street" class="hidden"></select>
    <select id="house" class="hidden"></select>
    <div id="setup-info" style="text-align:center; font-weight:bold; margin: 10px 0;"></div>
    <button id="saveBtn" class="save-btn hidden">Показати графік</button>
</div>

<div id="main-screen" class="hidden" style="width:100%; max-width:400px;">
    <div class="schedule-card">
        <div class="days-nav" id="currentDateNav">
            <span class="day active" id="queueLabel">Черга</span>
            <span class="day" id="todayDate">Дата</span>
        </div>
        <div class="grid" id="mainGrid"></div>
        <div class="status-bar" id="updateStatus">Оновлення...</div>
        <a class="reset-link" onclick="resetSettings()">Змінити адресу</a>
    </div>
</div>

<script>
    // --- КОНФІГУРАЦІЯ ---
    const API_URL = "https://cabinet.cherkasyoblenergo.com/api_new/disconn.php";
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh5p024BJEYr1VlXJst-AGCeu8zIXqfjwR7DJ_NXE4JN69qSsC1CoTI-ZaLcmn5UXjEFzlYb09p5H5/pub?output=csv"; // ВСТАВ СЮДИ CSV ПОСИЛАННЯ

    const setupScreen = document.getElementById('setup-screen');
    const mainScreen = document.getElementById('main-screen');
    const favicon = document.getElementById('favicon');
    const mainGrid = document.getElementById('mainGrid');

    let globalSlots = new Array(24).fill(0);

    // --- ЛОГІКА API ОБЛЕНЕРГО ---
    async function callApi(params) {
        const url = new URL(API_URL);
        Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
        try {
            const res = await fetch(url);
            return await res.json();
        } catch (e) { return null; }
    }

    async function initSetup() {
        const data = await callApi({ op: 'department_list' });
        const deptSelect = document.getElementById('department');
        deptSelect.innerHTML = '<option value="">Оберіть філію</option>';
        data.forEach(item => deptSelect.innerHTML += `<option value="${item.ID}">${item.NAME}</option>`);
    }

    document.getElementById('department').addEventListener('change', async (e) => {
        const data = await callApi({ op: 'city_list', dept_id: e.target.value });
        const s = document.getElementById('city');
        s.innerHTML = '<option value="">Оберіть місто</option>';
        data.forEach(item => s.innerHTML += `<option value="${item.ID}">${item.NAME}</option>`);
        s.classList.remove('hidden');
    });

    document.getElementById('city').addEventListener('change', async (e) => {
        const data = await callApi({ op: 'street_list', city_id: e.target.value });
        const s = document.getElementById('street');
        s.innerHTML = '<option value="">Оберіть вулицю</option>';
        data.forEach(item => s.innerHTML += `<option value="${item.ID}">${item.NAME}</option>`);
        s.classList.remove('hidden');
    });

    document.getElementById('street').addEventListener('change', async (e) => {
        const data = await callApi({ op: 'house_list', street_id: e.target.value, search_name: '' });
        const s = document.getElementById('house');
        s.innerHTML = '<option value="">№ будинку</option>';
        data.forEach(item => s.innerHTML += `<option value="${item.HOUSE}">${item.HOUSE}</option>`);
        s.classList.remove('hidden');
    });

    document.getElementById('house').addEventListener('change', async (e) => {
        document.getElementById('setup-info').innerText = "Визначаємо чергу...";
        const lsData = await callApi({ op: 'ls_list_by_addr', street_id: document.getElementById('street').value, house: e.target.value });
        const ls = Array.isArray(lsData) ? lsData[0].LS : lsData.LS;

        const now = new Date();
        const dateStr = `${String(now.getDate()).padStart(2,'0')}.${String(now.getMonth()+1).padStart(2,'0')}.${now.getFullYear()}`;
        const qData = await callApi({ op: 'disconn_by_ls', disconn_selector: 2, n_date: dateStr, k_date: dateStr, abon_ls: ls });

        const text = qData.DISCONN_QUEUQ[1].QUEUE_INFO;
        const queue = text.match(/\d+/g).join('.');
        localStorage.setItem('user_queue', queue);
        document.getElementById('setup-info').innerHTML = `Ваша черга: <span style="color:var(--primary-yellow)">${queue}</span>`;
        document.getElementById('saveBtn').classList.remove('hidden');
    });

    // --- ЛОГІКА ТВОГО ГРАФІКА ---

    function refreshFavicon() {
        const now = new Date();
        const hour = now.getHours();
        const min = now.getMinutes();
       }

    function drawSchedule(scheduleText) {
        mainGrid.innerHTML = '';
        globalSlots.fill(0);

        const intervals = scheduleText.split(',').map(i => i.trim());
        intervals.forEach(interval => {
            const parts = interval.split('-').map(p => p.trim());
            if (parts.length === 2) {
                const [sH, sM] = parts[0].split(':').map(Number);
                const [eH, eM] = parts[1].split(':').map(Number);

                for (let h = 0; h < 24; h++) {
                    if (h > sH && h < eH) globalSlots[h] = 1;
                    else if (h === sH) globalSlots[h] = (sM === 30) ? 2 : 1;
                    else if (h === eH) { if (eM === 30) globalSlots[h] = 3; }
                }
            }
        });

        for (let h = 0; h < 24; h++) {
            const div = document.createElement('div');
            div.className = 'slot';
            if (h === new Date().getHours()) div.style.boxShadow = "inset 0 0 0 2px var(--primary-yellow)";

            const span = document.createElement('span');
            span.textContent = h.toString().padStart(2, '0') + ':00';
            div.appendChild(span);

            if (globalSlots[h] === 1) div.classList.add('off');
            else if (globalSlots[h] === 2) div.classList.add('split-start');
            else if (globalSlots[h] === 3) div.classList.add('split-end');
            mainGrid.appendChild(div);
        }
        refreshFavicon();
    }

    // Оновлена функція зчитування CSV
    async function syncWithSheet() {
        const queue = localStorage.getItem('user_queue');
        if (!queue) return;

        setupScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        document.getElementById('queueLabel').innerText = `Черга ${queue}`;
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('uk-UA', {day:'numeric', month:'short'});

        try {
            const res = await fetch(SHEET_CSV_URL);
            const csv = await res.text();
            const rows = csv.split('\n');

            let schedule = "";

            for (let row of rows) {
                // ШУКАЄМО ПЕРШУ КОМУ (вона розділяє Чергу і Розклад)
                const firstCommaIndex = row.indexOf(',');
                if (firstCommaIndex === -1) continue;

                const rowQueue = row.substring(0, firstCommaIndex).replace(/"/g, '').trim();

                if (rowQueue === queue) {
                    // БЕРЕМО ВСЕ, що йде після першої коми (це і є наш повний розклад)
                    schedule = row.substring(firstCommaIndex + 1).replace(/"/g, '').trim();
                    break;
                }
            }

            if (schedule) {
                // Очищаємо від спецсимволів Google Таблиць (нерозривні пробіли тощо)
                const cleanSchedule = schedule.replace(/[\u00A0\u1680\u180e\u2000-\u200b\u202f\u205f\u3000]/g, " ");
                drawSchedule(cleanSchedule);
                document.getElementById('updateStatus').innerText = `Оновлено: ${new Date().toLocaleTimeString()}`;
            } else {
                document.getElementById('updateStatus').innerText = "Графік на сьогодні відсутній";
            }
        } catch (e) {
            console.error("Помилка завантаження CSV:", e);
        }
    }

    // Оновлена функція малювання (більш точна до хвилин)
    function drawSchedule(scheduleText) {
        mainGrid.innerHTML = '';
        globalSlots.fill(0);

        const intervals = scheduleText.split(',').map(i => i.trim());
        intervals.forEach(interval => {
            const parts = interval.split('-').map(p => p.trim());
            if (parts.length === 2) {
                const startParts = parts[0].split(':');
                const endParts = parts[1].split(':');

                const sH = parseInt(startParts[0]);
                const sM = parseInt(startParts[1] || 0);
                const eH = parseInt(endParts[0]);
                const eM = parseInt(endParts[1] || 0);

                for (let h = 0; h < 24; h++) {
                    // Година повністю без світла
                    if (h > sH && h < eH) {
                        globalSlots[h] = 1;
                    }
                    // Година початку (наприклад 02:30)
                    else if (h === sH) {
                        if (sM >= 30) globalSlots[h] = 2; // Світло є наполовину (split-start)
                        else globalSlots[h] = 1;         // Світла немає всю годину
                    }
                    // Година кінця (наприклад 04:30)
                    else if (h === eH) {
                        if (eM >= 30) globalSlots[h] = 3; // Світло з'явиться в середині (split-end)
                        // Якщо eM == 0, то година вже світла, залишаємо 0
                    }
                }
            }
        });

        for (let h = 0; h < 24; h++) {
            const div = document.createElement('div');
            div.className = 'slot';

            // Підсвітка поточної години
            if (h === new Date().getHours()) {
                div.style.border = "2px solid var(--primary-yellow)";
                div.style.backgroundColor = "rgba(255,108,0,0.07)";
            }

            const span = document.createElement('span');
            span.textContent = h.toString().padStart(2, '0') + ':00';
            div.appendChild(span);

            if (globalSlots[h] === 1) div.classList.add('off');
            else if (globalSlots[h] === 2) div.classList.add('split-start');
            else if (globalSlots[h] === 3) div.classList.add('split-end');
            mainGrid.appendChild(div);
        }
        refreshFavicon();
    }

    function resetSettings() {
        if(confirm("Змінити адресу?")) {
            localStorage.removeItem('user_queue');
            location.reload();
        }
    }

    document.getElementById('saveBtn').addEventListener('click', syncWithSheet);

    // СТАРТ
    if (localStorage.getItem('user_queue')) {
        syncWithSheet();
        setInterval(syncWithSheet, 60000);
    } else {
        initSetup();
    }
</script>

</body>
</html>
